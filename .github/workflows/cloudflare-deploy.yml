name: Workdoe Cloudflare Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Type DEPLOY to run the production Cloudflare deployment.
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: workdoe-cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify Workdoe Release Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate manual deploy confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "${{ github.ref }}" = "refs/heads/main"
          test "${{ inputs.deploy }}" = "DEPLOY"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Wrangler
        run: npm ci

      - name: Run local tests
        run: npm test

      - name: Run Cloudflare preflight
        run: npm run cf:preflight

      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run --config cloudflare/wrangler.jsonc

      - name: Smoke test Cloudflare Worker runtime
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply workdoe --local --config cloudflare/wrangler.jsonc
          npx wrangler dev --local --port 8787 --config cloudflare/wrangler.jsonc > "$RUNNER_TEMP/workdoe-wrangler.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health > /dev/null; then
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/workdoe-wrangler.log"
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8787/health > /dev/null
          curl --fail --silent http://127.0.0.1:8787/ > /dev/null
          curl --fail --silent 'http://127.0.0.1:8787/api/jobs/open?limit=1' > /dev/null

      - name: Print launch status
        run: npm run cf:status

  deploy:
    name: Deploy Workdoe To Cloudflare
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://workdoe.com
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.deploy == 'DEPLOY'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify current main release candidate
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          current_main="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" != "$current_main" ]; then
            echo "::error title=Stale release candidate::This run targets $GITHUB_SHA, but origin/main is $current_main. Start a new run from current main."
            exit 1
          fi
          echo "Release candidate is current main: $GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Wrangler
        run: npm ci

      - name: Check Cloudflare credentials are configured
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Capture sanitized Worker secret names
        run: npm run cf:secrets:evidence

      - name: Record same-domain Clerk proxy release proof
        run: npm run cf:clerk:proof

      - name: Validate release evidence
        run: npm run cf:release:evidence

      - name: Print guarded deploy plan
        run: npm run cf:deploy:plan

      - name: Deploy guarded production release
        run: npm run cf:deploy

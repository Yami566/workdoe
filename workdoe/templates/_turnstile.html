{% if turnstile_enabled() %}
  <div class="turnstile-field">
    <div
      class="{% if embedded_dialog_mode() %}workdoe-turnstile{% else %}cf-turnstile{% endif %}"
      {% if embedded_dialog_mode() %}data-workdoe-turnstile="true"{% endif %}
      data-sitekey="{{ turnstile_site_key() }}"
      data-action="{{ action|default('workdoe-form') }}"
      data-theme="light"
    ></div>
  </div>
{% endif %}

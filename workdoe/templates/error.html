{% extends "base.html" %}
{% block title %}{{ status_code }} - Workdoe{% endblock %}
{% block content %}
<section class="error-shell" aria-labelledby="error-title">
  <div class="error-code" aria-hidden="true">{{ status_code }}</div>
  <div class="error-copy">
    <p class="eyebrow">Workdoe</p>
    <h1 id="error-title">{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="hero-actions">
      <a class="button" href="{{ primary_url }}">{{ primary_label }}</a>
      <a class="button secondary" href="{{ secondary_url }}">{{ secondary_label }}</a>
    </div>
  </div>
</section>
{% endblock %}

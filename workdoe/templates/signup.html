{% extends "base.html" %}
{% block title %}Join Workdoe{% endblock %}
{% block content %}
<section class="auth-layout">
  <div>
    <p class="eyebrow">Join the local beta</p>
    <h1>Create a Workdoe account</h1>
    <p>Choose the role you need today. Client and contractor dashboards are intentionally separate so permissions stay clear.</p>
  </div>
  <form class="form-panel" method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label>
      Account type
      <select name="role" required>
        <option value="client">Client posting jobs</option>
        <option value="contractor">Contractor finding work</option>
      </select>
    </label>
    <label>
      Name
      <input name="display_name" autocomplete="name" required>
    </label>
    <label>
      Company or household
      <input name="company_name" autocomplete="organization">
    </label>
    <label>
      Email
      <input name="email" type="email" autocomplete="email" required>
    </label>
    <label>
      Password
      <input name="password" type="password" autocomplete="new-password" minlength="8" required>
    </label>
    <button class="button" type="submit">Create account</button>
  </form>
</section>
{% endblock %}
